<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoOils Demo Hub</title>
<meta name="theme-color" content="#1b1b1d">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ribbon" id="ribbon">DEMO – sample data</div>

<header class="top">
  <div class="brand">
    <!-- Text wordmark: ECOOILS in green, PROJECT stretched to the same width in yellow (replace with the real logo file if wanted) -->
    <svg viewBox="0 0 260 90" role="img" aria-label="EcoOils Project">
      <text x="0" y="56" textLength="260" lengthAdjust="spacing" font-family="Jost,sans-serif" font-weight="500" font-size="72" fill="#44a276">EcoOils</text>
      <text x="0" y="86" textLength="260" lengthAdjust="spacing" font-family="Jost,sans-serif" font-weight="500" font-size="24" fill="#ffc600">PROJECT</text>
    </svg>
    <small data-i="site">Sei Mangkei</small>
  </div>
  <div class="right">
    <div class="ver" id="ver">v1.3</div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button><button data-l="id" aria-pressed="false">ID</button><button data-l="ms" aria-pressed="false">MS</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 data-i="heroTitle"></h1>
  <p data-i="heroText"></p>
</section>

<div class="stats">
  <div class="stat"><b>3.6M+</b><span data-i="statHours"></span></div>
  <div class="stat"><b>30</b><span data-i="statApps"></span></div>
  <div class="stat"><b>0</b><span data-i="statPaper"></span></div>
</div>

<div class="sect"><div class="summary" id="summary"></div></div>
<div id="secs"></div>
<section class="sect"><h2 data-i="secApps"></h2><div class="grid" id="apps"></div></section>


<footer data-i="footer"></footer>

<div class="attract" id="attract" role="button" aria-label="Tap to start">
  <div class="rings"><i></i><i></i><i></i><b></b></div>
  <h2 data-i="tapStart">Tap to start</h2>
  <p data-i="attractSub">EcoOils Demo Hub</p>
</div>

<script src="vendor/qrcode.js"></script>
<script src="js/i18n.js"></script>
<script src="js/mocks.js"></script>
<script src="js/tour.js"></script>
<script src="js/app.js"></script>
</body>
</html>
