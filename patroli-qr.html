<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patroli QR checkpoints – EcoOils Demo Hub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/patroli.css">
</head>
<body>
<div class="ribbon">DEMO – sample data</div>
<header class="top noprint"><a class="back" href="patroli.html">← Patroli</a><button class="btn yellow" onclick="window.print()">Print</button></header>
<main class="pwrap">
  <div class="ptitle"><h1>Patroli QR</h1></div>
  <p class="noprint" style="color:var(--muted)">Print this page (A4, 2 per row) and place one code at each demo checkpoint. Each code contains only the text <code>EOP-DEMO-CP1</code> … <code>EOP-DEMO-CP6</code>. Works offline.</p>
  <div class="qrgrid" id="grid"></div>
</main>
<script src="vendor/qrcode.js"></script>
<script>
const URLMODE = new URLSearchParams(location.search).get("mode") === "url"; /* ?mode=url: codes open the demo from any phone camera */
const BASE = location.href.replace(/[^/]*([?#].*)?$/, "");
const NAMES = ["Main Gate", "Tank Farm", "Boiler House", "Process Unit", "Warehouse", "Substation"];
document.getElementById("grid").innerHTML = NAMES.map((n, i) => {
  const q = qrcode(0, "M"); q.addData(URLMODE ? BASE + "patroli.html?scan=" + (i + 1) : "EOP-DEMO-CP" + (i + 1)); q.make();
  return `<div class="qrc"><div class="big">${i + 1}</div>${q.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}<h3>${n}</h3><small>EOP-DEMO-CP${i + 1} · DEMO</small></div>`;
}).join("");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
